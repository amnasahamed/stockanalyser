<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Circuit Predictor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('index') }}">Stock Circuit Predictor</a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
            <a href="{{ url_for('screener') }}" {% if request.endpoint == 'screener' %}class="active"{% endif %}>UC Screener</a>
            <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}class="active"{% endif %}>History</a>
            <a href="{{ url_for('data_management') }}" {% if request.endpoint == 'data_management' %}class="active"{% endif %}>Data</a>
        </div>
        <div class="nav-search">
            <input type="text" id="stock-search" placeholder="Search stocks..." autocomplete="off">
            <div id="search-results"></div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Stock Circuit Predictor - Powerful Local Analysis System</p>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            // Remove after animation
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Debounce function for search
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Stock search functionality with debounce
        const searchInput = document.getElementById('stock-search');
        const searchResults = document.getElementById('search-results');
        let searchAbortController = null;

        const performSearch = debounce(async (query) => {
            if (query.length < 2) {
                searchResults.style.display = 'none';
                return;
            }

            // Cancel previous request
            if (searchAbortController) {
                searchAbortController.abort();
            }
            searchAbortController = new AbortController();

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`, {
                    signal: searchAbortController.signal
                });
                const results = await response.json();

                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-item">No results found</div>';
                } else {
                    searchResults.innerHTML = results.slice(0, 10).map(stock =>
                        `<a href="/stock/${stock.symbol}" class="search-item">
                            <strong>${stock.symbol}</strong> - ${stock.name} (${stock.exchange})
                        </a>`
                    ).join('');
                }
                searchResults.style.display = 'block';
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Search error:', error);
                }
            }
        }, 300);

        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value.trim());
        });

        // Keyboard navigation for search
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResults.style.display = 'none';
                searchInput.blur();
            }
            if (e.key === 'Enter') {
                const firstResult = searchResults.querySelector('a');
                if (firstResult) {
                    window.location.href = firstResult.href;
                }
            }
        });

        // Hide search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        // Button loading state helper
        function setButtonLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.dataset.originalText = button.innerHTML;
                button.innerHTML = '<span class="loading-spinner"></span> Loading...';
            } else {
                button.disabled = false;
                button.innerHTML = button.dataset.originalText || button.innerHTML;
            }
        }

        // Enhanced task status polling with visual feedback
        let pollInterval = null;

        function pollTaskStatus() {
            fetch('/api/task/status')
                .then(response => response.json())
                .then(data => {
                    const statusEl = document.getElementById('task-status');
                    if (statusEl) {
                        if (data.running) {
                            statusEl.innerHTML = `
                                <div class="task-running">
                                    <div class="task-message">
                                        <span class="loading-spinner" style="border-color: rgba(251, 140, 0, 0.3); border-top-color: #fb8c00; margin-right: 8px;"></span>
                                        ${data.message}
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress" style="width: ${data.progress}%"></div>
                                    </div>
                                    <div class="progress-text">${data.progress}% complete</div>
                                </div>
                            `;
                            // Disable all action buttons while task is running
                            document.querySelectorAll('.action-btn').forEach(btn => {
                                btn.disabled = true;
                            });
                            pollInterval = setTimeout(pollTaskStatus, 1000);
                        } else if (data.message) {
                            statusEl.innerHTML = `
                                <div class="task-complete">
                                    <div class="task-message">${data.message}</div>
                                </div>
                            `;
                            // Re-enable all action buttons
                            document.querySelectorAll('.action-btn').forEach(btn => {
                                btn.disabled = false;
                            });
                            // Show success toast if task completed
                            if (data.progress === 100) {
                                showToast(data.message, 'success');
                            }
                        }
                    }
                })
                .catch(error => {
                    console.error('Status poll error:', error);
                    // Retry after error
                    pollInterval = setTimeout(pollTaskStatus, 3000);
                });
        }

        // Start polling if there's a task status element
        if (document.getElementById('task-status')) {
            pollTaskStatus();
        }

        // Ripple effect for buttons
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple-effect');

                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);

                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                ripple.style.top = e.clientY - rect.top - size / 2 + 'px';

                this.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
            });
        });

        // API call helper with loading state and toast
        async function apiCall(endpoint, options = {}) {
            const method = options.method || 'POST';
            const button = options.button;

            if (button) {
                setButtonLoading(button, true);
            }

            try {
                const response = await fetch(endpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: options.body ? JSON.stringify(options.body) : undefined
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.status === 'started') {
                        showToast('Task started successfully', 'info');
                        pollTaskStatus();
                    }
                } else {
                    showToast(data.error || 'An error occurred', 'error');
                }

                return data;
            } catch (error) {
                showToast('Network error occurred', 'error');
                throw error;
            } finally {
                if (button) {
                    setButtonLoading(button, false);
                }
            }
        }

        // Global API call function
        window.apiCall = apiCall;
        window.showToast = showToast;

        // Animate numbers on page load
        document.querySelectorAll('.stat-value').forEach(el => {
            const finalValue = parseInt(el.textContent.replace(/,/g, ''));
            if (!isNaN(finalValue) && finalValue > 0) {
                el.textContent = '0';
                animateNumber(el, 0, finalValue, 1000);
            }
        });

        function animateNumber(element, start, end, duration) {
            const range = end - start;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Ease out cubic
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + range * easeProgress);

                element.textContent = current.toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        // Table row click handler for navigation
        document.querySelectorAll('.data-table tbody tr[data-href]').forEach(row => {
            row.style.cursor = 'pointer';
            row.addEventListener('click', () => {
                window.location.href = row.dataset.href;
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + K for search focus
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // Intersection Observer for animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe sections for scroll animations
        document.querySelectorAll('.section').forEach(section => {
            section.style.opacity = '0';
            section.style.transform = 'translateY(20px)';
            section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            observer.observe(section);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
